<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        SITTA UT - Sistem Informasi Tiras dan Transaksi Bahan Ajar
    </title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- SEO Description -->
    <meta
        name="description"
        content="Aplikasi simulasi SITTA Universitas Terbuka berbasis Vue.js 2"
    >
</head>

<body class="login-page">

    <!-- Root Aplikasi Vue -->
    <div id="app">

        <!-- Halaman Login -->
        <div v-if="tab === 'login'">
            <login-form
                :pengguna="pengguna"
                @login="login"
            ></login-form>
        </div>

        <!-- Halaman Utama Aplikasi -->
        <div v-else>

            <!-- Navigasi -->
            <app-navbar
                :tab="tab"
                @navigate="navigate"
                @logout="logout"
            ></app-navbar>

            <!-- Dashboard -->
            <dashboard-home
                v-if="tab === 'dashboard'"
                :nama-user="currentUser ? currentUser.nama : ''"
                @navigate="navigate"
            ></dashboard-home>

            <!-- Informasi Stok Bahan Ajar -->
            <section v-else-if="tab === 'stok'"
            class="tracking-container">
                <h1>Informasi Stok Bahan Ajar</h1>

                <ba-stock-table
                    :initial-data="initialData"
                ></ba-stock-table>
            </section>

            <!-- Tracking Delivery Order -->
            <section
                v-else-if="tab === 'tracking'"
                class="tracking-container"
            >
                <h1>Tracking Delivery Order</h1>

                <do-tracking
                    :initial-data="initialData"
                ></do-tracking>
            </section>

            <!-- Pemesanan Bahan Ajar -->
            <section
                v-else-if="tab === 'order'"
                class="tracking-container"
            >
                <h1>Pemesanan Bahan Ajar</h1>

                <order-form
                    :initial-data="initialData"
                ></order-form>
            </section>

        </div>
    </div>

    <!-- Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Custom SweetAlert Configuration -->
    <script src="js/services/alert.js"></script>

    <!-- Vue.js 2 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>

    <!-- API Service -->
    <script src="js/services/api.js"></script>

    <!-- Vue Components -->
    <script src="js/components/login-form.js"></script>
    <script src="js/components/app-navbar.js"></script>
    <script src="js/components/dashboard-home.js"></script>
    <script src="js/components/status-badge.js"></script>
    <script src="js/components/stock-table.js"></script>
    <script src="js/components/do-tracking.js"></script>
    <script src="js/components/order-form.js"></script>

    <!-- Root Application -->
    <script src="js/app.js"></script>

</body>
</html>
